<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PushButton</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="ap-stage">
  <div class="ap-ctl"><span class="ap-led"></span><button class="ap-push ap-push--olive" aria-pressed="true" aria-label="mains"></button><span class="ap-cap">mains</span></div>
  <div class="ap-ctl"><span class="ap-led"></span><button class="ap-push" aria-pressed="false" aria-label="auto"></button><span class="ap-cap">auto</span></div>
  <div class="ap-ctl"><span class="ap-led"></span><button class="ap-push" aria-pressed="false" aria-label="mono"></button><span class="ap-cap">mono</span></div>
  <div class="ap-ctl"><button class="ap-push" aria-label="seek"></button><span class="ap-cap">seek</span></div>
  <div class="ap-ctl"><span class="ap-led"></span><button class="ap-push ap-push--signal" aria-pressed="false" aria-label="power"></button><span class="ap-cap">power</span></div>
</div>
<script src="../bundle.js"></script>
</body>
</html>
