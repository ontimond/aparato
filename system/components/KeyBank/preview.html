<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>KeyBank</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="ap-stage">
  <div class="ap-bank">
    <div class="ap-keys" role="radiogroup" aria-label="band">
      <label class="ap-key"><input type="radio" name="band" aria-label="fm"><span></span></label>
      <label class="ap-key"><input type="radio" name="band" aria-label="am" checked><span></span></label>
      <label class="ap-key"><input type="radio" name="band" aria-label="short wave"><span></span></label>
      <label class="ap-key"><input type="radio" name="band" aria-label="phono"><span></span></label>
    </div>
    <div class="ap-key-caps ap-scale" aria-hidden="true"><span>fm</span><span>am</span><span>sw</span><span>phono</span></div>
  </div>
</div>
</body>
</html>
