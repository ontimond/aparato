<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChannelSwitch</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="ap-stage">
  <div class="ap-ctl">
    <div class="ap-chan" role="radiogroup" aria-label="channel">
      <span class="ap-chan-arrow" aria-hidden="true"></span>
      <label class="ap-chan-step"><input type="radio" name="channel" value="1"><span class="ap-scale">1</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="2"><span class="ap-scale">2</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="3"><span class="ap-scale">3</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="4" checked><span class="ap-scale">4</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="5"><span class="ap-scale">5</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="6"><span class="ap-scale">6</span></label>
      <label class="ap-chan-step"><input type="radio" name="channel" value="7"><span class="ap-scale">7</span></label>
    </div>
    <span class="ap-cap">channel</span>
  </div>
</div>
</body>
</html>
